[package]
name = "rusthashtab-scan"
description = "File discovery, path normalization and concurrent hashing pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rusthashtab-hash.workspace = true
rusthashtab-sumfile.workspace = true
rusthashtab-settings.workspace = true
thiserror.workspace = true

# The pipeline reads with overlapped I/O and owns its events. `Win32_Security` is
# not about security here: `CreateEventW` lives behind it because its
# `SECURITY_ATTRIBUTES` parameter does.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }