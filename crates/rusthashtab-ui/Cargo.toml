[package]
name = "rusthashtab-ui"
description = "Win32 dialog UI for the rustHashTab property sheet page"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
rusthashtab-hash.workspace = true
rusthashtab-scan.workspace = true
rusthashtab-settings.workspace = true
rusthashtab-abi.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
