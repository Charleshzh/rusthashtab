[package]
name = "rusthashtab-settings"
description = "Persisted user settings for rustHashTab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    # `RegCreateKeyExW` takes a `SECURITY_ATTRIBUTES`, which lives behind this
    # feature, so the real-registry round-trip test cannot compile without it.
    # It was already enabled transitively by another crate in the same build
    # graph, which made `cargo test --workspace` pass while
    # `cargo test -p rusthashtab-settings` failed outright. A crate has to
    # declare what its own code needs.
    "Win32_Security",
] }
